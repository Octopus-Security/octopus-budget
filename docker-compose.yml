version: '3.8'

services:
  budget-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NPM_TOKEN
    container_name: octopus_budget_tracker
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - budget_data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      # Legacy HS256 secret — RETIRED. Empty on purpose; never give this a
      # default again, and never a working one.
      #
      # It used to read `${JWT_SECRET:-octopus-shared-secret-change-in-production}`,
      # a value published in the (then public) octopus-auth repo. Removing the
      # variable from Portainer to retire it therefore did not stop this service
      # trusting a shared secret — it started trusting a public one, and anyone
      # could mint a session for any user. This service holds a database per
      # user, so that was personal data for both accounts.
      #
      # Empty means auth-client skips the key. Verification is RS256 via
      # AUTH_PUBLIC_KEY below, which is confirmed set in the container.
      - JWT_SECRET=${JWT_SECRET:-}
      # This service verifies sessions LOCALLY with the shared secret, so it
      # needs the RSA public key to keep doing that once auth signs RS256.
      # Without it, every session is rejected here the moment auth switches.
      # A Portainer variable only interpolates into THIS file — a name absent
      # here never reaches the container, whatever the UI shows.
      - AUTH_PUBLIC_KEY=${AUTH_PUBLIC_KEY:-}
      - AUTH_SERVICE_URL=http://octopus-auth:3002
      # Machine-to-machine: cortex /purchase posts here. Must match cortex's INTERNAL_SECRET.
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
      # Whose budget receives internal purchase writes.
      - BUDGET_OWNER=${BUDGET_OWNER:-psychopathy}
    networks:
      - octopus_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  octopus_network:
    name: octopus_network
    external: true

volumes:
  budget_data:
